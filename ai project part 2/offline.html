<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Code Century Offline (HTML Only)</title>

<style>
  body {
    margin: 0;
    background: #0f172a;
    color: #e5e7eb;
    font-family: "Inter", Arial, sans-serif;
  }

  #header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px;
    background: #1e1e22;
    border-bottom: 2px solid #3b82f6;
  }

  #title {
    font-size: 40px;
    font-weight: 700;
    color: #3b82f6;
  }

  #logo svg {
    width: 60px;
    height: 60px;
  }

  #editorBox {
    padding: 20px;
    max-width: 1000px;
    margin: auto;
  }

  #offlineEditor {
    width: 100%;
    height: 350px;
    background: #1e1e22;
    color: #e5e7eb;
    border: 2px solid #3b82f6;
    border-radius: 12px;
    padding: 12px;
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
  }

  #offlinePreview {
    width: 100%;
    height: 350px;
    background: white;
    border-radius: 12px;
    margin-top: 20px;
  }

  #controls {
    margin-top: 20px;
    display: flex;
    gap: 10px;
  }

  button {
    padding: 12px 20px;
    background: #3b82f6;
    border: none;
    border-radius: 10px;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }

  input[type="file"] {
    padding: 12px;
    background: #1e1e22;
    color: white;
    border-radius: 10px;
    border: 2px solid #3b82f6;
  }

  #warning {
    margin-top: 10px;
    color: #ef4444;
    font-weight: 600;
    display: none;
  }
</style>
</head>

<body>

<div id="header">
  <div id="logo">
    <svg viewBox="0 0 180 180">
      <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3b82f6"/>
          <stop offset="50%" stop-color="#a855f7"/>
          <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
      </defs>
      <rect width="180" height="180" rx="40" fill="url(#grad)"/>
      <text x="50%" y="55%" text-anchor="middle" font-size="80" fill="white" font-family="Arial Rounded MT Bold">C</text>
      <circle cx="70" cy="70" r="8" fill="white"/>
      <circle cx="110" cy="70" r="8" fill="white"/>
      <rect x="55" y="100" width="70" height="20" rx="6" fill="white"/>
    </svg>
  </div>

  <div id="title">Code Century Offline (HTML Only)</div>
</div>

<div id="editorBox">

  <textarea id="offlineEditor" placeholder="Write HTML only..."></textarea>

  <div id="warning">⚠ Only HTML is allowed in Offline Mode.</div>

  <div id="controls">
    <button onclick="offlinePreview()">Preview</button>
    <button onclick="offlineSave()">Save HTML</button>
    <input type="file" id="offlineFile" accept=".html" onchange="offlineLoad()">
  </div>

  <iframe id="offlinePreview"></iframe>

</div>

<script>
  function isHTML(text) {
    return text.trim().startsWith("<") && text.includes("</");
  }

  function offlinePreview() {
    const code = document.getElementById("offlineEditor").value;

    if (!isHTML(code)) {
      document.getElementById("warning").style.display = "block";
      return;
    }

    document.getElementById("warning").style.display = "none";
    document.getElementById("offlinePreview").srcdoc = code;
  }

  function offlineSave() {
    const code = document.getElementById("offlineEditor").value;

    if (!isHTML(code)) {
      document.getElementById("warning").style.display = "block";
      return;
    }

    document.getElementById("warning").style.display = "none";

    const blob = new Blob([code], { type: "text/html" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "offline_code.html";
    a.click();
  }

  function offlineLoad() {
    const file = document.getElementById("offlineFile").files[0];

    if (!file.name.endsWith(".html")) {
      document.getElementById("warning").style.display = "block";
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
      const content = e.target.result;

      if (!isHTML(content)) {
        document.getElementById("warning").style.display = "block";
        return;
      }

      document.getElementById("warning").style.display = "none";
      document.getElementById("offlineEditor").value = content;
    };

    reader.readAsText(file);
  }
</script>

</body>
</html>
