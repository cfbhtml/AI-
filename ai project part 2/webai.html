<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My AI Assistant</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 16px;
      background: #1e3a8a;
      border-bottom: 2px solid #3b82f6;
      font-size: 22px;
      font-weight: bold;
      color: white;
      text-align: center;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .msg {
      max-width: 75%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .user {
      background: #3b82f6;
      margin-left: auto;
      border-bottom-right-radius: 2px;
      color: white;
    }

    .ai {
      background: #1e293b;
      margin-right: auto;
      border-bottom-left-radius: 2px;
    }

    #input-area {
      display: flex;
      padding: 12px;
      background: #1e3a8a;
      border-top: 2px solid #3b82f6;
    }

    #inputBox {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
    }

    #sendBtn {
      margin-left: 10px;
      padding: 12px 18px;
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    #status {
      padding: 6px 12px;
      font-size: 12px;
      color: #93c5fd;
      text-align: center;
    }
  </style>
</head>

<body>

<header>My AI Assistant</header>

<div id="chat"></div>

<div id="input-area">
  <input id="inputBox" placeholder="Type your message..." />
  <button id="sendBtn">Send</button>
</div>

<div id="status">Status: idle</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("inputBox");
  const sendBtn = document.getElementById("sendBtn");
  const statusEl = document.getElementById("status");

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage("user", text);
    input.value = "";
    input.focus();

    statusEl.textContent = "Status: contacting backend...";
    sendBtn.disabled = true;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session: "default",
          message: text
        })
      });

      const data = await res.json();

      if (data.reply) {
        addMessage("ai", data.reply);
        statusEl.textContent = "Status: idle";
      } else {
        addMessage("ai", "Backend error: no reply received.");
        statusEl.textContent = "Status: backend error";
      }

    } catch (err) {
      addMessage("ai", "Backend unreachable — is server.py running?");
      statusEl.textContent = "Status: backend unreachable";
    }

    sendBtn.disabled = false;
  }

  sendBtn.onclick = sendMessage;

  input.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
